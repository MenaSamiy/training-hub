<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C1E2E" />
    <meta
      name="description"
      content="Training Hub - Comprehensive training and learning management system"
    />
    <title>Training Hub - Learning Platform</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #F5F5F5;
        color: #1A1A1A;
      }

      html {
        overflow-y: scroll;
      }

      .react-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #0C1E2E 0%, #001F3F 100%);
        color: #00BCD4;
        font-size: 1.2em;
        font-weight: 600;
      }
    </style>
    <noscript>
      <div style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #0C1E2E;
        color: #FF6600;
        font-size: 1.2em;
        font-weight: 600;
        text-align: center;
        padding: 20px;
      ">
        <div>
          <p>⚠️ JavaScript is required to run this application.</p>
          <p>Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>
  </head>
  <body>
    <div id="root">
      <div class="react-loading">
        <div>🎓 Training Hub is loading...</div>
      </div>
    </div>
  </body>
</html>
